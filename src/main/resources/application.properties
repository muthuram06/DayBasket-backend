# ==========================================
# APPLICATION
# ==========================================
spring.application.name=daybasket-api
server.port=${PORT:8080}

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/daybasket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================
# FLYWAY DATABASE MIGRATIONS
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# JWT CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.com.daybasket=${APP_LOG_LEVEL:INFO}

# ==========================================
# ADMIN BOOTSTRAP
# ==========================================
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}


# ==========================================
# RAZORPAY PAYMENT GATEWAY
# ==========================================
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
